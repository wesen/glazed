app:
  name: production-log-processor
  version: 1.0.0
  environment: production
  debug: false

logging:
  level: info
  format: json
  output: stderr
  add_caller: true
  time_format: "2006-01-02T15:04:05Z07:00"

server:
  host: "0.0.0.0"
  port: 8080
  metrics_enabled: true
  metrics_port: 9090

storage:
  type: local
  path: /var/log/processed
  retention_days: 90
  options:
    backup_enabled: "true"
    compression: "gzip"
